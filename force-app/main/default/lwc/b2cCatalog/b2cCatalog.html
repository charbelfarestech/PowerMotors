<template>
    <lightning-card title="B2C Catalog" icon-name="standard:product">

        <!-- Hero banner -->
        <div class="hero">
            <div class="eyebrow">Power Motors</div>
            <h2>B2C Product Catalog</h2>
            <p>Filter by category and country · Select items using checkboxes to build your order</p>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar slds-p-horizontal_medium slds-p-vertical_small">
            <div class="pill-group">
                <template for:each={categoryOptions} for:item="cat">
                    <button key={cat.value}
                            class={cat.btnClass}
                            data-val={cat.value}
                            onclick={handleCategoryChange}>
                        {cat.label}
                    </button>
                </template>
            </div>
            <div class="country-wrap">
                <lightning-combobox
                    label="Country of Origin"
                    value={selectedCountry}
                    options={countryOptions}
                    onchange={handleCountryChange}>
                </lightning-combobox>
            </div>
        </div>

        <!-- Body: table + sidebar -->
        <div class="body slds-p-horizontal_medium slds-p-bottom_medium">

            <!-- Catalog Lightning Datatable -->
            <section class="table-section">
                <template if:true={hasProducts}>
                    <lightning-datatable
                        key-field="pricebookEntryId"
                        data={pagedProducts}
                        columns={columns}
                        selected-rows={selectedRowsForCurrentPage}
                        onrowselection={handleRowSelection}
                        onrowaction={handleRowAction}>
                    </lightning-datatable>

                    <!-- Pagination -->
                    <div class="pager slds-m-top_medium">
                        <button class="pager-btn" disabled={isFirstPage} onclick={prevPage}>&#8249;</button>
                        <span class="pager-label">Page {currentPage} of {totalPages}</span>
                        <button class="pager-btn" disabled={isLastPage} onclick={nextPage}>&#8250;</button>
                    </div>
                </template>

                <template if:false={hasProducts}>
                    <div class="empty-msg">
                        <lightning-icon icon-name="utility:search" size="small"></lightning-icon>
                        <span>No products match the selected filters. Make sure products are active and have a Pricebook Entry.</span>
                    </div>
                </template>
            </section>

            <!-- Order summary sidebar -->
            <aside class="sidebar">
                <div class="summary-box">
                    <div class="summary-title">
                        <lightning-icon icon-name="utility:cart" size="x-small"></lightning-icon>
                        <span>Order Summary</span>
                    </div>

                    <template if:true={hasSelectedItems}>
                        <ul class="sel-list">
                            <template for:each={selectedItems} for:item="item">
                                <li key={item.pricebookEntryId} class="sel-item">
                                    <span class="sel-name">{item.name}</span>
                                    <span class="sel-right">
                                        <span class="sel-price">{item.formattedPrice}</span>
                                        <button class="remove-btn"
                                                data-id={item.pricebookEntryId}
                                                onclick={removeSelectedItem}
                                                title="Remove">&#10005;</button>
                                    </span>
                                </li>
                            </template>
                        </ul>
                        <div class="total-row">
                            <span>Total</span>
                            <span class="total-amount">{formattedTotal}</span>
                        </div>
                        <div class="opp-input slds-m-vertical_small">
                            <lightning-input
                                type="text"
                                label="Opportunity Name"
                                value={opportunityName}
                                placeholder="e.g. John Smith – B2C Sale"
                                onchange={handleOppNameChange}
                                required
                                class="opp-name-input">
                            </lightning-input>
                        </div>
                        <button class="create-btn" disabled={isCreateDisabled} onclick={createOpportunity}>
                            Save &amp; Create Won Opportunity
                        </button>
                    </template>

                    <template if:false={hasSelectedItems}>
                        <div class="summary-empty">
                            <p>No items selected.</p>
                            <p class="hint">Check a product row to add it to your order.</p>
                        </div>
                    </template>
                </div>
            </aside>
        </div>

        <!-- Product Details Modal -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                            &#10005;
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate">{selectedProductDetail.name}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="detail-body">
                            <div class="detail-img slds-m-bottom_small">
                                <img src={selectedProductDetail.imageUrl} alt={selectedProductDetail.name} class="product-thumb" />
                            </div>
                            <dl class="detail-fields">
                                <dt>Serial #</dt>
                                <dd>{selectedProductDetail.serialNumber}</dd>

                                <dt>Country of Origin</dt>
                                <dd>{selectedProductDetail.countryOfOrigin}</dd>

                                <dt>Avg. Life Expectancy</dt>
                                <dd>{selectedProductDetail.avgLife}</dd>

                                <dt>Description</dt>
                                <dd class="dd-description">{selectedProductDetail.description}</dd>

                                <template if:true={selectedProductDetail.isGenerator}>
                                    <dt class="section-sep">Generator Details</dt>
                                    <dt>Size</dt>
                                    <dd>{selectedProductDetail.generatorSize}</dd>
                                    <dt>Weight</dt>
                                    <dd>{selectedProductDetail.weightKg}</dd>
                                    <dt>Phase</dt>
                                    <dd>{selectedProductDetail.phase}</dd>
                                    <dt>Power (KVA)</dt>
                                    <dd>{selectedProductDetail.kva}</dd>
                                    <dt>Engine Type</dt>
                                    <dd>{selectedProductDetail.engineType}</dd>
                                </template>

                                <template if:true={selectedProductDetail.isPart}>
                                    <dt class="section-sep">Part Details</dt>
                                    <dt>Weight</dt>
                                    <dd>{selectedProductDetail.weightKg}</dd>
                                </template>
                            </dl>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Close" onclick={closeModal}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
