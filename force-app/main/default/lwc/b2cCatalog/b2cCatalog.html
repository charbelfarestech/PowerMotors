<template>
    <lightning-card title="B2C Catalog" icon-name="standard:product">

        <!-- Hero banner -->
        <div class="hero">
            <div class="eyebrow">Power Motors</div>
            <h2>B2C Product Catalog</h2>
            <p>Filter by category and country · Click a product name to expand details · Select items to build your order</p>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar slds-p-horizontal_medium slds-p-vertical_small">
            <!-- Dynamic category pills driven by org picklist -->
            <div class="pill-group">
                <template for:each={categoryOptions} for:item="cat">
                    <button key={cat.value}
                            class={cat.btnClass}
                            data-val={cat.value}
                            onclick={handleCategoryChange}>
                        {cat.label}
                    </button>
                </template>
            </div>
            <div class="country-wrap">
                <lightning-combobox
                    label="Country of Origin"
                    value={selectedCountry}
                    options={countryOptions}
                    onchange={handleCountryChange}>
                </lightning-combobox>
            </div>
        </div>

        <!-- Body: table + sidebar -->
        <div class="body slds-p-horizontal_medium slds-p-bottom_medium">

            <!-- Catalog table -->
            <section class="table-section">
                <template if:true={hasProducts}>
                    <table class="ctable">
                        <thead>
                            <tr>
                                <th>Product Name</th>
                                <th>Family</th>
                                <th>Country of Origin</th>
                                <th class="text-right">Unit Price</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={pagedProducts} for:item="p">

                                <!-- product row -->
                                <tr key={p.pricebookEntryId} class={p.rowClass}>
                                    <td>
                                        <button class={p.nameBtnClass}
                                                data-id={p.pricebookEntryId}
                                                onclick={toggleDetails}>
                                            {p.name}
                                            <span class="chevron">{p.chevron}</span>
                                        </button>
                                    </td>
                                    <td><span class={p.badgeClass}>{p.productFamily}</span></td>
                                    <td>{p.countryOfOrigin}</td>
                                    <td class="text-right price-cell">{p.formattedPrice}</td>
                                    <td class="text-center">
                                        <button class={p.selectBtnClass}
                                                data-id={p.pricebookEntryId}
                                                onclick={toggleSelect}>
                                            {p.buttonLabel}
                                        </button>
                                    </td>
                                </tr>

                                <!-- inline detail row -->
                                <tr key={p.detailKey} class={p.detailRowClass}>
                                    <td colspan="5" class="detail-td">
                                        <div class="detail-body">
                                            <!-- Render dynamic product image or SVG fallback -->
                                            <div class="detail-img">
                                                <img src={p.imageUrl} alt={p.name} class="product-thumb" />
                                            </div>
                                            <dl class="detail-fields">

                                                <!-- Common fields for ALL products -->
                                                <dt>Serial #</dt>
                                                <dd>{p.serialNumber}</dd>

                                                <dt>Country of Origin</dt>
                                                <dd>{p.countryOfOrigin}</dd>

                                                <dt>Avg. Life Expectancy</dt>
                                                <dd>{p.avgLife}</dd>

                                                <dt>Description</dt>
                                                <dd class="dd-description">{p.description}</dd>

                                                <!-- Generator-only fields -->
                                                <template if:true={p.isGenerator}>
                                                    <dt class="section-sep">Generator Details</dt>

                                                    <dt>Size</dt>
                                                    <dd>{p.generatorSize}</dd>

                                                    <dt>Weight</dt>
                                                    <dd>{p.weightKg}</dd>

                                                    <dt>Phase</dt>
                                                    <dd>{p.phase}</dd>

                                                    <dt>Power (KVA)</dt>
                                                    <dd>{p.kva}</dd>

                                                    <dt>Engine Type</dt>
                                                    <dd>{p.engineType}</dd>
                                                </template>

                                                <!-- Parts-only section label -->
                                                <template if:true={p.isPart}>
                                                    <dt class="section-sep">Part Details</dt>

                                                    <dt>Weight</dt>
                                                    <dd>{p.weightKg}</dd>
                                                </template>

                                            </dl>
                                        </div>
                                    </td>
                                </tr>

                            </template>
                        </tbody>
                    </table>

                    <!-- Pagination -->
                    <div class="pager">
                        <button class="pager-btn" disabled={isFirstPage} onclick={prevPage}>&#8249;</button>
                        <span class="pager-label">Page {currentPage} of {totalPages}</span>
                        <button class="pager-btn" disabled={isLastPage} onclick={nextPage}>&#8250;</button>
                    </div>
                </template>

                <template if:false={hasProducts}>
                    <div class="empty-msg">
                        <lightning-icon icon-name="utility:search" size="small"></lightning-icon>
                        <span>No products match the selected filters. Make sure products are active and have a Pricebook Entry.</span>
                    </div>
                </template>
            </section>

            <!-- Order summary sidebar -->
            <aside class="sidebar">
                <div class="summary-box">
                    <div class="summary-title">
                        <lightning-icon icon-name="utility:cart" size="x-small"></lightning-icon>
                        <span>Order Summary</span>
                    </div>

                    <template if:true={hasSelectedItems}>
                        <ul class="sel-list">
                            <template for:each={selectedItems} for:item="item">
                                <li key={item.pricebookEntryId} class="sel-item">
                                    <span class="sel-name">{item.name}</span>
                                    <span class="sel-right">
                                        <span class="sel-price">{item.formattedPrice}</span>
                                        <button class="remove-btn"
                                                data-id={item.pricebookEntryId}
                                                onclick={toggleSelect}
                                                title="Remove">&#10005;</button>
                                    </span>
                                </li>
                            </template>
                        </ul>
                        <div class="total-row">
                            <span>Total</span>
                            <span class="total-amount">{formattedTotal}</span>
                        </div>
                        <div class="opp-input">
                            <lightning-input
                                type="text"
                                label="Opportunity Name"
                                value={opportunityName}
                                placeholder="e.g. John Smith – B2C Sale"
                                onchange={handleOppNameChange}>
                            </lightning-input>
                        </div>
                        <button class="create-btn" onclick={createOpportunity}>
                            Save &amp; Create Won Opportunity
                        </button>
                    </template>

                    <template if:false={hasSelectedItems}>
                        <div class="summary-empty">
                            <p>No items selected.</p>
                            <p class="hint">Click <strong>Select</strong> on a product row to add it to your order.</p>
                        </div>
                    </template>
                </div>
            </aside>
        </div>

    </lightning-card>
</template>
