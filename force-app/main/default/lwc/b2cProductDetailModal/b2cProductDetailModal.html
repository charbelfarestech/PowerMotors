<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                    &#10005;
                </button>
                <h2 class="slds-modal__title slds-hyphenate">{product.name}</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <div class="detail-body">
                    <div class="detail-img slds-m-bottom_small">
                        <img src={product.imageUrl} alt={product.name} class="product-thumb" />
                    </div>
                    <dl class="detail-fields">
                        <dt>Serial #</dt>
                        <dd>{product.serialNumber}</dd>

                        <dt>Country of Origin</dt>
                        <dd>{product.countryOfOrigin}</dd>

                        <dt>Avg. Life Expectancy</dt>
                        <dd>{product.avgLife}</dd>

                        <dt>Description</dt>
                        <dd class="dd-description">{product.description}</dd>

                        <template if:true={product.isGenerator}>
                            <dt class="section-sep">Generator Details</dt>
                            <dt>Size</dt>
                            <dd>{product.generatorSize}</dd>
                            <dt>Weight</dt>
                            <dd>{product.weightKg}</dd>
                            <dt>Phase</dt>
                            <dd>{product.phase}</dd>
                            <dt>Power (KVA)</dt>
                            <dd>{product.kva}</dd>
                            <dt>Engine Type</dt>
                            <dd>{product.engineType}</dd>
                        </template>

                        <template if:true={product.isPart}>
                            <dt class="section-sep">Part Details</dt>
                            <dt>Weight</dt>
                            <dd>{product.weightKg}</dd>
                        </template>
                    </dl>
                </div>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button label="Close" onclick={handleClose}></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
